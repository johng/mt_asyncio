[package]
name = "mt_asyncio"
version = "0.2.0-alpha.1"
description = "A parallel asyncio runtime for free-threaded Python"
authors = ["John Griffith <john.griffith243@gmail.com>"]
license = "BSD-3-Clause"
edition = "2024"

keywords = ["asyncio", "async", "io", "threading", "networking"]

readme = "README.md"
homepage = "https://github.com/johng/mt_asyncio"
repository = "https://github.com/johng/mt_asyncio"

include = [
    "/Cargo.toml",
    "/pyproject.toml",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/src",
    "/mt_asyncio",
    "/tests",
    "!__pycache__",
    "!tests/.pytest_cache",
    "!*.so",
]

[lib]
name = "_mt_asyncio"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "=1.0"
arc-swap = "=1.9"
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
mio = { version = "=1.2", features = ["net", "os-ext", "os-poll"] }
papaya = "=0.2"
pyo3 = { version = "=0.29", features = ["anyhow", "extension-module", "generate-import-lib"] }
socket2 = { version = "=0.6", features = ["all"] }

mimalloc = { version = "0.1.49", default-features = false, features = ["local_dynamic_tls"], optional = true }
tikv-jemallocator = { version = "=0.7", default-features = false, features = ["disable_initial_exec_tls"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.159"

[build-dependencies]
pyo3-build-config = "=0.29"

[features]
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
