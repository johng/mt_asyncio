  release:
    name: publish to pypi
    runs-on: ubuntu-latest
    # needs: [ version, sdist, wheels, wheels-pgo ]
    needs: [ version, sdist, wheels ]
    if: needs.version.outputs.release == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/mt-asyncio
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Publish package to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Last, so that the tag means "this version is on PyPI". A run that dies
  # before here leaves no tag, which is what makes it safe to just merge again.
  github-release:
    name: github release
    runs-on: ubuntu-latest
    needs: [ version, release ]
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # semver pre-releases carry a hyphen (v0.1.0-alpha.1); finals do not
          case "$TAG" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          # --target creates the tag: nothing tagged this commit before now
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            $prerelease \
            dist/*
