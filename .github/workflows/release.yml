name: release

# Releases follow main. `[project] version` in pyproject.toml is the trigger:
# bump it in a PR, and merging that PR publishes. Nothing to tag by hand --
# `github-release` creates the tag once PyPI has accepted the upload.
on:
  push:
    branches:
      - main
  # for re-running a release that failed before the tag was created
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  PY_ALL: 3.14t 3.15t

jobs:
  # The gate, and the reason merging to main is not ruinous: an ordinary merge
  # costs this one job and stops. Everything below runs only when pyproject.toml
  # carries a version that has never been tagged.
  version:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # tags are how we know what is already out
    - id: check
      run: |
        set -euo pipefail
        # parsed, not grepped: this is the string the wheels will carry, and a
        # near-miss here would tag one version and publish another
        version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        tag="v${version}"
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
          echo "release=false" >> "$GITHUB_OUTPUT"
          echo "::notice::${tag} is already released -- nothing to do"
        else
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "::notice::releasing ${tag}"
        fi

  # Nothing is built, let alone published, until the suite is green. `test`
  # triggers on this same push independently, but that copy runs in parallel --
  # it could still be going, or already failing, while we upload to PyPI. This
  # one is a dependency, which is the difference that matters.
  test:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/test.yml

  sdist:
    needs: [ version, test ]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: pyo3/maturin-action@v1
      with:
        rust-toolchain: stable
        command: sdist
        args: --out dist
    - name: Upload sdist
      uses: actions/upload-artifact@v7
      with:
        name: dist-sdist
        path: dist

  wheels:
    name: wheel ${{ matrix.platform || matrix.os }}(${{ matrix.target }}) - ${{ matrix.manylinux || 'auto' }}
    needs: [ version, test ]
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        target: [x86_64, aarch64]
        manylinux: [auto]
        include:
          - os: ubuntu
            platform: linux
            target: i686
          - os: ubuntu
            platform: linux
            target: armv7
          - os: ubuntu
            platform: linux
            target: x86_64
            manylinux: musllinux_1_1
          - os: ubuntu
            platform: linux
            target: aarch64
            manylinux: musllinux_1_1
          - os: ubuntu
            platform: linux
            target: armv7
            manylinux: musllinux_1_1
        # PGO builds
        # exclude:
        #   - os: ubuntu
        #     target: x86_64
        #   - os: macos
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pyo3/maturin-action@v1
        with:
          rust-toolchain: stable
          command: build
          args: --release --out dist --interpreter ${{ matrix.interpreter || env.PY_ALL }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.container }}
          docker-options: -e CI
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform || matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'auto' }}
          path: dist

  # wheels-pgo:
