[project]
name = 'mt-asyncio'
authors = [
    { name = 'John Griffith', email = 'me@joh.ng' }
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: BSD License',
    'Operating System :: MacOS',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python :: Free Threading :: 3 - Stable',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python',
    'Programming Language :: Rust',
]

# the released version, and the release trigger: bump it in a PR and merging
# that PR publishes. Declared here rather than left dynamic so there is one
# obvious place to change and one for CI to read (Cargo.toml keeps its own
# version for the Rust crate, which is not published anywhere).
version = '0.1.0-alpha.1'

dynamic = [
    'description',
    'keywords',
    'license',
    'readme',
]

requires-python = '>=3.14'
dependencies = []

[dependency-groups]
build = [
    'maturin~=1.8',
]
lint = [
    # pinned to a minor series on purpose: `~=0.11` admits every 0.x, so CI was
    # silently installing 0.16 and failing. 0.16 turns nearly every stable rule
    # on by default -- and `extend-select` extends that default, so the list
    # below stopped being the rule set and became an addition to it (46 errors
    # from rules this project never chose) -- and its formatter now emits PEP
    # 758's unparenthesised `except A, B:`. Moving to it is a deliberate change
    # with a repo-wide diff, not something a `uv sync` should decide.
    'ruff~=0.11.0',
]
test = [
    'pytest~=8.3',
    'trustme~=1.2',
]
# upstream TonIO, installed alongside mt_asyncio so bench/tonio_regression.py can
# check the shared Rust core has not regressed. Distinct package + extension
# module names, so the two coexist in one venv.
bench = [
    'tonio==0.8.3',
]

all = [
    { include-group = 'build' },
    { include-group = 'lint' },
    { include-group = 'test' },
    { include-group = 'bench' },
]

[project.urls]
Homepage = 'https://github.com/johng/mt_asyncio'
Source = 'https://github.com/johng/mt_asyncio'
Issues = 'https://github.com/johng/mt_asyncio/issues'
Upstream = 'https://github.com/gi0baro/tonio'

[project.entry-points]
pytest11 = {mt_asyncio = "mt_asyncio._testutils._pytest_plugin"}

[build-system]
requires = ['maturin>=1.8.0,<2']
build-backend = 'maturin'

[tool.maturin]
module-name = 'mt_asyncio._mt_asyncio'
bindings = 'pyo3'

[tool.ruff]
line-length = 120

# these belong under `lint`, not at the top level -- ruff has warned about the
# old spelling since 0.2 and stops honouring it in 0.16
[tool.ruff.lint]
extend-select = [
    # E and F are enabled by default
    'B',      # flake8-bugbear
    'C4',     # flake8-comprehensions
    'C90',    # mccabe
    'I',      # isort
    'N',      # pep8-naming
    'Q',      # flake8-quotes
    'RUF100', # ruff (unused noqa)
    'S',      # flake8-bandit
    'W',      # pycodestyle
]
extend-ignore = [
    'B008', # function calls in args defaults are fine
    'B009', # getattr with constants is fine
    'B034', # re.split won't confuse us
    'B904', # rising without from is fine
    'E501', # leave line length to black
    'N818', # leave to us exceptions naming
    'S101', # assert is fine
    'S110',
]
flake8-quotes = { inline-quotes = 'single', multiline-quotes = 'double' }
mccabe = { max-complexity = 25 }

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
known-first-party = ['mt_asyncio', 'tests']

[tool.ruff.lint.per-file-ignores]
'mt_asyncio/_mt_asyncio.pyi' = ['I001']
'tests/**' = ['B018', 'S110', 'S501']

[tool.uv]
package = false
